<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>potyk.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: Rubik, system-ui;
        }

        main {
            margin-left: auto;
            margin-right: auto;
            max-width: 900px;
        }

        .card {
            /* https://getcssscan.com/css-box-shadow-examples */
            box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
            background: white;
            border-radius: 16px;
            padding: 10px;
        }

        .grid-3-col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        h1 {
            font-size: 3rem;
            margin-top: 24px;
            margin-bottom: 0px;
            text-align: center
        }

        h2 {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding-bottom: 8px;
        }

        #globe {
            width: 24px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }
    </style>


</head>
<body>

<main style="">
    <div style="; margin-bottom: 24px;">
        <h1>potyk.io</h1>
        <div class="flex-center" style=" color: #9f9f9f">
            Делаю свой интернет <img src="static/img/globe.gif" id="globe">
        </div>
    </div>

    <div class="grid-3-col" id="cards"></div>


</main>


</body>

<script>
    const cards = [
        {
            title: 'Музыка',
            items: [
                {
                    icon: '📊',
                    title: 'Альбомы: стата и любимые ',
                    link: 'https://docs.google.com/spreadsheets/d/1Dy9fxDgLzxy84PsIAoyappVB9xfTYHls1rn9KNe4gDs/edit?usp=sharing',
                },
                {
                    icon: '📝',
                    title: "Музыка: Качаем, Размечаем",
                    link: "/guides/music",
                },
                {
                    icon: '🤝',
                    title: "Го дружить в RYM",
                    link: "https://rateyourmusic.com/~potykion",
                },
            ]
        }
    ]

    const cardsHtml = cards.map(card => {
        const cardItemsHtml = card.items.map(cardItem => {
            return `<li>${cardItem.icon} <a href="${cardItem.link}">${cardItem.title}</a></li>`
        }).join('')

        return `<div class="card">
            <h2>${card.title}</h2>
            <ul>${cardItemsHtml}</ul>
        </div>`
    }).join('')

    document.querySelector('#cards').innerHTML = cardsHtml;
</script>


</html>
